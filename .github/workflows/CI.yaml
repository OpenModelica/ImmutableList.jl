name: Tests

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'COPYING'
      - 'CITATION.bib'
      - '.gitignore'
      - '.github/workflows/omjl.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'COPYING'
      - 'CITATION.bib'
      - '.gitignore'
      - '.github/workflows/omjl.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - name: Run tests
        shell: bash
        run: julia --project=. -e 'using Pkg; Pkg.test()'
